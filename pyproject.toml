[project]
name = "app"
version = "0.1.0"
description = ""
authors = [
    {name = "Gavin Haynes",email = "haynes.gt@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.124.4,<0.125.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "psycopg[binary,pool] (>=3.3.2,<4.0.0)",
    "alembic (>=1.17.2,<2.0.0)",
    "temporalio (>=1.20.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "orjson (>=3.11.5,<4.0.0)",
    "uvloop (>=0.22.1,<0.23.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "openai (>=2.13.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pre-commit = ">=3.8.0,<4.0.0"
ruff = ">=0.6.4,<0.7.0"
debugpy = "^1.8.19"

[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4
extend-exclude = ["dist", "build", ".venv", "venv", "env", ".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
