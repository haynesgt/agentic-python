services:
  postgres:
    image: postgres:17
    ports:
      - "25432:5432"
    volumes:
      - "pg-data:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
      - "8233:8233"
    depends_on:
      - postgres
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
      - POSTGRES_DB=temporal
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
      - TEMPORAL_UI_ENABLED=true
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    entrypoint: temporal
    command: server start-dev --ui-ip 0.0.0.0 --ip 0.0.0.0
    restart: on-failure

  llm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    runtime: nvidia   # remove if CPU-only
    ports:
      - "8150:8150"
    volumes:
      - llm-cache:/root/.cache
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: >
      Qwen/Qwen3-VL-8B-Instruct
      --host 0.0.0.0
      --port 8150
      --max-model-len 9000
      --gpu-memory-utilization 0.90
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-debug
      args:
        - PORT=8000
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
      - "5678:5678"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DB=agentic_dev
      - DB_PORT=5432
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASS=postgres
      - OPENAI_API_BASE_URL=http://llm:8150/v1
      - OPENAI_MODEL=Qwen/Qwen3-VL-8B-Instruct
      - OPENAI_API_KEY=dummy_key
      - LOG_LEVEL=debug

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DB=agentic_dev
      - DB_PORT=5432
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASS=postgres

volumes:
  pg-data:
  llm-cache:
